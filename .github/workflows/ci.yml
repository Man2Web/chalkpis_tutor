name: CI
on: [push, pull_request]
# Read-only: CI only checks out code and runs tests; it never writes to the repository (hardening, 9 Nov 2026).
permissions:
  contents: read
# Actions and images are pinned to exact versions (a commit, a digest), so a changed tag upstream cannot change what
# runs here. To update: look up the new release's commit and the image's digest, and change both lines together.
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm --prefix app ci
      - run: npm --prefix app run lint
      - run: npm --prefix app run typecheck
      - run: npm --prefix app test -- --ci

  server:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          MARIADB_ROOT_PASSWORD: ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm --prefix server ci
      - run: npm --prefix server run lint
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
      - run: npm --prefix server run build
