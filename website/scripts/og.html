<!doctype html>
<!--
  The link preview image (public/og.png, 1200×630) for WhatsApp, Facebook, Meta ads and X, and with ?cover the
  Facebook Page cover (1640×624, everything kept in the middle 1100 px that phones and the profile picture leave).
  Photographed by scripts/make-images.mjs with headless Chrome. Same look and headline as the home page hero.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Inter Tight';font-weight:700;src:url('../node_modules/@fontsource/inter-tight/files/inter-tight-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:Inter;font-weight:400;src:url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:Inter;font-weight:500;src:url('../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#FFFFFF;color:#0B0B0F;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;display:flex;padding:56px 56px 56px 72px;gap:48px}
.text{flex:1;display:flex;flex-direction:column}
h1{margin-top:48px;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:68px;line-height:1.02;letter-spacing:-0.03em;text-wrap:balance}
.lead{margin-top:24px;font-size:22px;line-height:1.5;color:#3F3F46;max-width:520px}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600}
.foot .pill{background:#EAF4FB;color:#0A5F99;border-radius:999px;padding:8px 16px;font-size:18px}
.art{width:440px;flex:none;border-radius:28px;overflow:hidden;background:#0E77BE}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.phone{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:262px;height:372px;background:#FFFFFF;border:10px solid #0B0B0F;border-radius:42px;padding:24px 18px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:0 40px 60px -30px rgba(11,40,70,0.45)}
.when{font-size:12px;color:#71717A}
.batch{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.01em}
.count{font-size:12px;color:#52525B;margin-bottom:4px}
.r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F6F7F9;font-size:13px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:#EAF4FB;color:#0A5F99;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.n{flex:1}
.pl{height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center}
.ok{background:#E7F6EF;color:#047857}.no{background:#FDECEC;color:#B91C1C}
.save{margin-top:auto;height:42px;border-radius:12px;background:#0B0B0F;color:#FFFFFF;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:262px;background:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:10px;box-shadow:0 20px 40px -20px rgba(11,11,15,0.3),0 0 0 1px rgba(11,11,15,0.06);font-size:13px;line-height:1.4}
.toast .ic{width:32px;height:32px;flex:none;border-radius:10px;background:#E7F6EF;display:flex;align-items:center;justify-content:center}
.toast strong{display:block;font-weight:600}.toast span.s{color:#52525B}
.hl{color:#0E77BE}
/* Facebook cover: wider, shorter, content in the middle */
html.cover,html.cover body{width:1640px;height:624px}
html.cover body{padding:64px 270px;gap:64px}
html.cover h1{margin-top:36px;font-size:66px}
html.cover .lead{max-width:560px}
/* the Page's profile picture covers the bottom-left corner on desktop */
html.cover .foot{margin-top:32px}
html.cover .art{width:420px}
</style>
<script>if (location.search.indexOf('cover') >= 0) document.documentElement.classList.add('cover');</script>
</head>
