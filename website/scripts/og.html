<!doctype html>
<!--
  The link preview image (public/og.png, 1200×630) for WhatsApp, Facebook, Meta ads and X, and with ?cover the
  Facebook Page cover (1640×624, everything kept in the middle 1100 px that phones and the profile picture leave).
  Photographed by scripts/make-images.mjs with headless Chrome. Same headline as the home page hero; brand kit colours
  and type (brand/README.md), and the kit's own logo file.-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:Inter;font-weight:800;src:url('../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#FFFFFF;color:#111111;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;display:flex;padding:56px 56px 56px 72px;gap:48px}
.text{flex:1;display:flex;flex-direction:column}
.logo{display:block;align-self:flex-start;height:50px;width:auto}
h1{margin-top:48px;font-weight:800;font-size:72px;line-height:1.02;letter-spacing:-0.035em;text-wrap:balance}
.lead{margin-top:24px;font-size:22px;line-height:1.5;color:#262626;max-width:520px}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600}
.foot .pill{background:#EAF4FB;color:#0B64A0;border-radius:999px;padding:8px 16px;font-size:18px}
.art{width:440px;flex:none;border-radius:28px;overflow:hidden;background:#0E77BE}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.hl{color:#0E77BE}
/* Facebook cover: wider, shorter, content in the middle */
html.cover,html.cover body{width:1640px;height:624px}
html.cover body{padding:64px 270px;gap:64px}
html.cover h1{margin-top:36px;font-size:68px}
html.cover .lead{max-width:560px}
/* the Page's profile picture covers the bottom-left corner on desktop */
html.cover .foot{margin-top:32px}
html.cover .art{width:420px}
</style>
<script>if (location.search.indexOf('cover') >= 0) document.documentElement.classList.add('cover');</script>
</head>
<body>
<div class="text">
<img class="logo" src="../brand/tutor-logo-color.svg" alt="ChalkPis Tutor">
<h1>Collect every fee <span class="hl">on time</span></h1>
<p class="lead">Fee reminders on WhatsApp with your own UPI QR, attendance in seconds and automatic receipts, for tuition centres, coaching classes and academies.</p>
<div class="foot"><span class="pill">Free for 7 days</span><span>chalkpistutor.com</span></div>
</div>
<div class="art"><img src="../public/app/home-dashboard.webp" alt=""></div>
</body>
</html>
